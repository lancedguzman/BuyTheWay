{% extends 'base.html' %}
{% load static %}

{% block title %}Edit {{ product.name }} - Buy The Way{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px; margin: 3vw auto; padding: 2vw; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9;">
    <h2 style="margin-bottom: 1.5vw; text-align: center;">Edit Product: {{ product.name }}</h2>
    
    <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1vw;">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <div style="display: flex; justify-content: space-between; margin-top: 1.5vw;">
            <a href="{% url 'marketplace:product_view' product.pk %}" style="padding: 0.8vw 1.5vw; background-color: #ccc; color: #333; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center;">
                Cancel
            </a>
            <button type="submit" style="padding: 0.8vw 1.5vw; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
