{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="icon" type="image/png" href="{% static 'icons/favicon.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Body & Layout */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex: 1;
        }

        .left-panel {
            display: flex;
            background-color: #3D70EF;
            width: 50vw;
            align-items: center;
            justify-content: center;
        }

        .left-panel img {
            width: 25vw;
        }

        .right-panel {
            width: 50vw;
            display: flex;
            flex-direction: column;
        }

        .right-panel > img {
            width: 50vw;
        }

        .form-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 3.5vw;
            row-gap: 0.8vw;
            padding-top: 0.8vw;
            padding-left: 2.5vw;
        }

        .form-container p {
            margin: 0;
        }

        /* Form Labels */
        .form-container label {
            display: block;
            margin-bottom: 0.8vw;
            font-size: 1.2vw;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            color: #000000;
        }

        /* Input Fields & Dropdowns */
        .form-container input,
        .form-container select {
            width: 20vw;
            height: 3vw;
            background-color: #F6F6F6;
            border: none;
            border-radius: 1vw;
            box-shadow: inset 0px 4px 4px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            padding: 0 1vw;

            font-family: 'Roboto', sans-serif;
            font-size: 1.2vw;
            font-weight: 500;
            color: #000000;
        }

        .form-container input::placeholder {
            color: #8D8D8D;
        }

        /* Seller Additional Field */
        #seller-additional-field {
            grid-column: 1 / -1;
        }

        #seller-additional-field input {
            width: 100%;
            height: 3vw;
            background-color: #F6F6F6;
            border: none;
            border-radius: 1vw;
            box-shadow: inset 0px 4px 4px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            padding: 0 1vw;
            font-family: 'Roboto', sans-serif;
            font-size: 1.2vw;
        }

        #seller-additional-field label {
            display: block;
            margin-bottom: 0.8vw;
            font-size: 1.2vw;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            color: #000000;
        }

        /* Submit Button */
        button[type="submit"] {
            grid-column: 1 / -1;
            justify-self: center;
            width: 15vw;
            height: 3vw;
            margin-top: 3vw;
            background-color: #9B71F7;
            color: white;
            border: none;
            border-radius: 1vw;
            font-size: 1.2vw;
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
        }
    </style>
</head>

<body>

    <main>
        <div class="left-panel">
            <img src="{% static 'icons/logo.png' %}" alt="">
        </div>
        <div class="right-panel">
            <img src="{% static 'icons/joinus.png' %}">
            <div class="form-wrapper">
                <form method="post" class="form-container">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">SIGN UP</button>
                </form>
            </div>
        </div>
    </main>
</body>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const userTypeSelect = document.getElementById('id_user_type');
    const formContainer = document.querySelector('.form-container');
    
    // Create the additional field container
    const sellerField = document.createElement('div');
    sellerField.id = 'seller-additional-field';
    sellerField.style.display = 'none';
    sellerField.innerHTML = `
        <label for="id_store_name">Store Name:</label>
        <input type="text" id="id_store_name" name="store_name">
    `;
    
    // Insert after birthdate field
    const birthdateField = document.getElementById('id_birthdate').closest('p');
    birthdateField.after(sellerField);
    
    // Listen for changes
    userTypeSelect.addEventListener('change', function() {
        if (this.value === 'S') {  // 'S' for Seller
            sellerField.style.display = 'block';
        } else {
            sellerField.style.display = 'none';
        }
    });
});
</script>

</html>
